version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bdsnowflake-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpass
      POSTGRES_DB: bdsnowflake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./исходные_данные:/data:ro
      - ./init:/docker-entrypoint-initdb.d
    command: postgres -c max_connections=200

volumes:
  postgres_data:
    name: bdsnowflake_postgres_data